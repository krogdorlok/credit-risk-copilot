[project]
name = "agentic-analytics-copilot"
version = "0.1.0"
description = "Agentic copilot answering questions over Freddie Mac loan data, FRED macro series, and SEC 10-K filings"
readme = "README.md"
authors = [
    { name = "Eshaan Kapoor", email = "dorlokkrog@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentic_analytics_copilot --cov-report=term-missing"
